      margin-top: 16px;

      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 16px;

      font-size: 0.9rem;

  "ณัฐวุฒิ", "สัมฤทธิ์", "ภูษิต", "เริงฤดี", "ฉัตรชัย", "วริษา",

];

const lecturerSelect = document.getElementById("lecturerFilter");
lecturerList.sort().forEach(name => {
  const opt = document.createElement("option");
  opt.value = name;
  opt.textContent = `อ. ${name}`;
  lecturerSelect.appendChild(opt);
});

const container = document.getElementById("scheduleContainer");
const searchInput = document.getElementById("searchInput");
const weekSelect = document.getElementById("weekFilter");
const resultCount = document.getElementById("resultCount");

function getBadge(format, isGroup) {
  if (format === "Exam") return '<span class="badge badge-exam">[ สอบ ]</span>';
  if (format === "Online") return '<span class="badge badge-online">[ Online ]</span>';
  if (format === "Hybrid") return '<span class="badge badge-hybrid">[ Hybrid ]</span>';
  if (isGroup) return '<span class="badge">[ กลุ่มย่อย ]</span>';
  return '<span class="badge">[ Onsite ]</span>';
}

function renderSchedule() {
  const query = searchInput.value.toLowerCase().trim();
  const selectedLecturer = lecturerSelect.value;
  const selectedWeek = weekSelect.value;

  container.innerHTML = "";
  let lastDate = "";
  let count = 0;

  scheduleData.forEach(item => {
    const matchSearch = item.topic.toLowerCase().includes(query) || 
                        item.lecturer.toLowerCase().includes(query);
    const matchLecturer = !selectedLecturer || item.lecturer.includes(selectedLecturer);
    const matchWeek = !selectedWeek || item.week === selectedWeek;

    if (matchSearch && matchLecturer && matchWeek) {
      count++;

      if (item.date !== lastDate) {
        lastDate = item.date;
        const dHeader = document.createElement("div");
        dHeader.className = "day-header";
        dHeader.textContent = `${item.week} — ${item.date}`;
        container.appendChild(dHeader);
      }

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="time-col">${item.time}</div>
        <div class="topic-col">
          <h3>${item.topic}</h3>
          <div class="lecturer-name">ผู้สอน: ${item.lecturer}</div>
        </div>
        <div>${getBadge(item.format, item.isGroup)}</div>
      `;
      container.appendChild(card);
    }
  });

  resultCount.textContent = `แสดงผลทั้งสิ้น ${count} รายการ`;
}

searchInput.addEventListener("input", renderSchedule);
lecturerSelect.addEventListener("change", renderSchedule);
weekSelect.addEventListener("change", renderSchedule);

renderSchedule();
